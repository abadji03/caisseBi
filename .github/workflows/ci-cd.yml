      #     docker tag caissibi-backend:latest ${{ secrets.DOCKER_USERNAME }}/caissibi-backend:latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/caissibi-backend:latest

  # =========================
  # JOB 2 : Frontend Angular
  # =========================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Tests Angular désactivés : aucun fichier *.spec.ts n'existe encore.
      # À activer dès le premier test écrit :
      # - name: Run tests
      #   run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Audit des dépendances (non bloquant)
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Build Angular
        run: npm run build -- --configuration production

