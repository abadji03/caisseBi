<!-- panier.component.html -->
<div *ngIf="showPanierSection" class="card mb-3">
  <!-- <div class="card-header">{{ titre }}</div> -->
  <div class="card-body">
    <div class="mt-3 d-flex justify-content-center">
      <h2>{{ titre }}</h2>
    </div>

    <div class="bg-secondary d-flex justify-content-between align-items-center mt-1 p-2 text-white">
      <span>📌 Panier en cours...</span>
      <span>📅 Heure: {{ currentTime }}</span>
      <span>💰 Total panier : <strong>{{ totalPanier }} F CFA</strong></span>
      <span>💰 Total à payer : <strong>{{ totalAPayer }} F CFA</strong></span>
    </div>

    <div *ngIf="showActions" class="row mt-2">
     <form [formGroup]="panierForm" (ngSubmit)="enregistrerPanier()">
      <div class="row mt-2">
        <div class="col-md-2 searchChamp">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="searchInput"
            placeholder="Rechercher un produit..."
            (input)="filterProduits()"
            [ngModelOptions]="{ standalone: true }"
          />
          <!-- <ul
            *ngIf="filteredProduits.length > 0 && searchInput"
            class="list-group position-absolute"
            style="width: 230px; z-index: 1000;"
          >
            <li *ngFor="let prod of filteredProduits" class="list-group-item bg-info">
              <button
                type="button"
                class="list-group-item-action w-100 text-start bg-transparent border-0"
                (click)="selectProduit(prod)"
              >
                {{ prod.designation }}
              </button>
            </li>
          </ul> -->
          <div *ngIf="filteredProduits.length > 0 && searchInput" class="dropdown-menu show w-25 bg-info">
            <button
              *ngFor="let prod of filteredProduits"
              type="button"
              class="dropdown-item "
              (click)="selectProduit(prod)"
            >
              {{ prod.designation }}
              <small class="text-muted"> - {{ prod.prixVenteUnitaire }} FCFA</small>
            </button>
          </div>
        </div>

        <div class="col-md-2" *ngIf="showRemiseField">
          <input
            type="number"
            class="form-control"
            formControlName="remise"
            placeholder="Remise"
          />
        </div>
        
        <div class="col-md-2 d-flex align-items-center">
          <input
            type="checkbox"
            class="form-check-input me-2"
            formControlName="inclureTVA"
            (change)="toggleTVA($event)"
          />
          <label for="tauxTVA" class="form-check-label">Inclure TVA</label>
        </div>
        
        <div *ngIf="panierForm.get('inclureTVA')?.value" class="col-md-2">
          <select class="form-select" formControlName="tauxTVA" (change)="updateTVA()">
            <option *ngFor="let taux of tauxTVAList" [value]="taux">{{ taux }}%</option>
          </select>
        </div>
        <div class="col-md-2" *ngIf="showAvanceField">
          <input
            type="number"
            class="form-control"
            formControlName="avance"
            placeholder="Avance"
          />
        </div>
        <div class="col-md-2">
          <select class="form-select" formControlName="typePaiement">
            <option value="" disabled selected>Mode de paiement</option>
            <option value="caisse">Caisse</option>
            <option value="mobile money">Mobile Money</option>
            <option value="banque">Banque</option>
            <option value="bon">Bon</option>
          </select>
        </div>
      </div>

      <!-- Tableau du panier -->
      <table class="table mt-2">
        <thead>
          <tr>
            <th>Produit</th>
            <th>Unité Stock</th>
            <th>Quantité</th>
            <th>Prix Unitaire</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody formArrayName="panier">
          <tr *ngIf="panierArray.length === 0">
            <td colspan="5" class="text-center text-muted">🛒 Panier vide</td>
          </tr>
          <tr *ngFor="let article of panierArray.controls; let i = index" [formGroupName]="i">
            <td>
              <input type="text" class="form-control" formControlName="produit" readonly />
            </td>
            <td>
              <input type="text" class="form-control" formControlName="uniteStock" readonly />
            </td>
            <td>
              <input type="number" class="form-control" formControlName="quantite" />
            </td>
            <td>
              <input type="number" class="form-control" formControlName="prixUnitaire" />
            </td>
            <td>
              <button type="button" class="btn btn-danger" (click)="removeArticle(i)">🗑</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Bouton de soumission -->
      <div class="d-flex justify-content-center">
        <button type="submit" class="btn btn-success w-25 me-3"><i class="bi bi-floppy2-fill"></i> Enregistrer</button>
        <button type="button" class="btn btn-warning w-25" (click)="annulerPanier()"> <i class="bi bi-x-lg text-danger fb-1"></i> Annuler</button>
      </div>
    </form>    
  </div>

    
  </div>
</div>
