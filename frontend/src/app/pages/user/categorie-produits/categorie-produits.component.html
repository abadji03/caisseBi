<div class="container-fluid bg-light py-5">
    <div class="container bg-white pt-0 pb-5 px-0">
        <div class="row h-25 px-0 rounded-0 mx-0 bg-warning d-flex justify-content-between">

            <div class="col">
              <h4 class="mb-2">Catégorie</h4>
            </div>
  
            <div class="col d-flex justify-content-end">
              <div class="card " style=" width: 100px; height: 100px">
                <img src="./assets/featur-1.jpg" class="card-img-top" alt="fruit légumes" width="100px" height="140px">
            </div>
            </div>
            
            
          </div>
        <div class="row d-flex justify-content-start align-items-start">
        
                <div class="col-md-3 card-product px-5 my-2" *ngFor="let product of products">
                    <div class="card">
          
                      <div class="image-container">
          
                        <div class="first">
                          
                          <div class="d-flex justify-content-between align-items-center">
          
                          <span class="discount">-25%</span>
                          <span class="wishlist"><mat-icon>favorite_border</mat-icon></span>
                          
          
                            </div>
                        </div>
          
                        <img [src]="product.imageUrl" class="img-fluid rounded thumbnail-image">
                        
          
                      </div>
          
          
                      <div class="product-detail-container p-2">
          
                          <div class="d-flex justify-content-between align-items-center">
          
                            <h5 class="dress-name">{{product.nomCourt}}</h5>
          
                            <div class="d-flex flex-column mb-2">
          
                              <span class="new-price">{{product.prix}} FCFA</span>
                              <small class="old-price text-right">5.99F CFA</small>
                            </div>
          
                          </div>
          
          
                          <div class="d-flex justify-content-between align-items-center pt-1">
          
                            <div class="color-select d-flex ">
          
                              <input type="button" name="grey" class="btn creme">
                              <input type="button" name="red" class="btn red ml-2">
                              <input type="button" name="blue" class="btn blue ml-2">
          
                            </div>
          
                            <div class="d-flex ">
                              
                              <span class="item-size mr-2 btn" type="button">S</span>
                              <span class="item-size mr-2 btn" type="button">M</span>
                              <span class="item-size btn" type="button">L</span>
          
                            </div>
                            
          
                          </div>
                          <div class="rating-star d-flex justify-content-center mx-2">
                            <mat-icon >star</mat-icon>
                            <mat-icon>star</mat-icon>
                            <mat-icon>star</mat-icon>
                            <mat-icon>star</mat-icon>
                            <mat-icon >star</mat-icon>
                            <span class="rating-number">4.8</span>
                          </div>
                            <!-- <span class="buy">Acheter +</span> -->
                          <button (click)="onSelectedProduit(product)" class="buy d-flex justify-content-center btn border border-1 py-2 rounded-pill px-3">
                              <mat-icon> add_shopping_cart</mat-icon>Ajouter au panier
                            </button>
                        
                      </div>
                      
                    </div>
                    <div class="mt-1">
                      <div class="card voutchers">
        
                        <div class="voutcher-divider">
        
                          <div class="voutcher-left text-center">
                            <span class="voutcher-name">Monday Happy</span>
                            <h5 class="voutcher-code">#MONHPY</h5>
                            
                          </div>
                          <div class="voutcher-right text-center border-left">
                            <h5 class="discount-percent">20%</h5>
                            <span class="off">Off</span>
                            
                          </div>
                            
                        </div>
                        
                      </div>
                      
                    </div>

</div>
