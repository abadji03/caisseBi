<div class="container-fluid">
  <div class="row">
    <!-- Sidebar (2 colonnes) -->
    <div class="col-2 sidebar" [class.collapsed]="isSidebarCollapsed">
      <nav>
        <div class="sidebar-header">
          <img src="./assets/CMP.png" class="avatar img-fluid rounded me-1" alt="User" width="50" height="50" />
          <span class="text-dark" *ngIf="!isSidebarCollapsed">User</span>
          <h4 *ngIf="!isSidebarCollapsed">Nom Structure</h4>
        </div>

        <div class="accordion" id="accordionSidebar">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" routerLink="/espace-vendeurs/overview" routerLinkActive="active">
                <i class="bi bi-house-door"></i>
                <span *ngIf="!isSidebarCollapsed">Vue d'ensemble</span>
              </button>
            </h2>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#ventesSubMenu" aria-expanded="false" aria-controls="ventesSubMenu">
                <i class="bi bi-cash-stack"></i>
                <span *ngIf="!isSidebarCollapsed">Ventes</span>
              </button>
            </h2>
            <div id="ventesSubMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/ventes" routerLinkActive="active">Ventes</button>
                <button class="nav-link" routerLink="/espace-vendeurs/caisse" routerLinkActive="active">Caisse</button>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#stockSubMenu" aria-expanded="false" aria-controls="stockSubMenu">
                <i class="bi bi-box"></i>
                <span *ngIf="!isSidebarCollapsed">Stock/Inventaire</span>
              </button>
            </h2>
            <div id="stockSubMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/entrees-sorties" routerLinkActive="active">Entrées/Sorties</button>
                <button class="nav-link" routerLink="/espace-vendeurs/stock" routerLinkActive="active">Stock</button>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" routerLink="/espace-vendeurs/clients" routerLinkActive="active">
                <i class="bi bi-person"></i>
                <span *ngIf="!isSidebarCollapsed">Clients</span>
              </button>
            </h2>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#produitsSubMenu" aria-expanded="false" aria-controls="produitsSubMenu">
                <i class="bi bi-boxes"></i>
                <span *ngIf="!isSidebarCollapsed">Produits</span>
              </button>
            </h2>
            <div id="produitsSubMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/catalogue-produits" routerLinkActive="active">Catalogue</button>
                <button class="nav-link" routerLink="/espace-vendeurs/enregistrement-produit" routerLinkActive="active">Ajout</button>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" routerLink="/espace-vendeurs/fournisseurs" routerLinkActive="active">
                <i class="bi bi-truck"></i>
                <span *ngIf="!isSidebarCollapsed">Fournisseurs</span>
              </button>
            </h2>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" routerLink="/espace-vendeurs/rapports-financiers" routerLinkActive="active">
                <i class="bi bi-graph-up"></i>
                <span *ngIf="!isSidebarCollapsed">Rapports financiers</span>
              </button>
            </h2>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" routerLink="/espace-vendeurs/parametres" routerLinkActive="active">
                <i class="bi bi-bar-chart"></i>
                <span *ngIf="!isSidebarCollapsed">Paramètres</span>
              </button>
            </h2>
          </div>
        </div>


      </nav>
    </div>

    <!-- Main Content (10 colonnes) -->
    <div class="col-10 main-content" [ngClass]="{'col-10': !isSidebarCollapsed, 'col-11': isSidebarCollapsed}">
      <header class="header d-flex justify-content-between align-items-center">
        <button class="menu-toggle" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <div class="header-title">Tableau de bord</div>
        <div class="btn-group">
          <div class="mt-0 py-3">
            <i class="bi bi-bell position-relative icon-notification">
              <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">3</span>
            </i>
          </div>
          <button class="btn dropdown-toggle" id="idMenu" data-bs-toggle="dropdown">
            <img src="./assets/CMP.png" class="avatar img-fluid rounded me-1" width="30" height="30" />
            <span class="text-dark">User</span>
          </button>
          <ul class="dropdown-menu">
            <li><button class="dropdown-item" routerLink="/user-login"><i class="bi bi-person"></i> Profil</button></li>
            <li><button class="dropdown-item" routerLink="/user-account"><i class="bi bi-gear"></i> Paramètres</button></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item">Déconnexion</button></li>
          </ul>
        </div>
      </header>

      <div class="dashboard-overview">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
