<div>
  <h1>Gestion des rôles et permissions</h1>

  <button class="btn btn-success mb-2 float-end" (click)="openRoleModal()">
    <i class="bi bi-plus-circle me-2"></i>Nouveau rôle
  </button>

  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <table class="table table-bordered table-striped table-hover table-responsive" *ngIf="!isLoading">
    <thead class="table-dark">
      <tr>
        <th>Id</th>
        <th>Nom</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of roles">
        <td>{{ role.id }}</td>
        <td>{{ role.nom }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="editRole(role)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-danger btn-sm" (click)="deleteRole(role.id!)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal pour ajouter/modifier un rôle -->
  <div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ isEditMode ? 'Modifier le Rôle' : 'Ajouter un Rôle' }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form [formGroup]="roleForm" (ngSubmit)="onSubmitRole()">
            <div class="mb-3">
              <label class="form-label">Nom du Rôle</label>
              <input type="text" class="form-control" formControlName="name" required>
            </div>

            <!-- <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" formControlName="description" rows="3"></textarea>
            </div> -->

            <div class="mb-3">
              <label class="form-label">Permissions</label>
              <div class="permissions-container">
                <div *ngFor="let permission of allPermissions" class="form-check">
                  <input class="form-check-input" type="checkbox" 
                         [id]="'perm-' + permission.id"
                         [value]="permission.id"
                         [checked]="roleForm.value.permissions.includes(permission.id)"
                         (change)="onPermissionChange(permission.id!, $event)">
                  <label class="form-check-label" [for]="'perm-' + permission.id">
                    {{ permission.nom }} ({{ permission.type }})
                  </label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100" [disabled]="roleForm.invalid">
              {{ isEditMode ? 'Modifier' : 'Enregistrer' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
