<div class="container-fluid mt-4">
  <nav>
    <div class="nav nav-tabs" id="nav-tab" role="tablist">
      <a class="nav-link active" id="nav-depenses-tab" data-bs-toggle="tab" href="#nav-depenses" 
         role="tab" aria-controls="nav-depenses" aria-selected="true">
        Dépenses
      </a>
      <a class="nav-link" id="nav-recette-tab" data-bs-toggle="tab" href="#nav-recette" 
         role="tab" aria-controls="nav-recette" aria-selected="false">
        Recettes
      </a>
      <a class="nav-link" id="nav-categorie-tab" data-bs-toggle="tab" href="#nav-categorie" 
         role="tab" aria-controls="nav-categorie" aria-selected="false">
        Gestion des catégories
      </a>
    </div>
  </nav>

  <div class="tab-content mt-4" id="nav-tabContent">
    <div class="tab-pane fade show active" id="nav-depenses" role="tabpanel" 
         aria-labelledby="nav-depenses-tab">
      <app-depenses
        [code_structure]="code_structure"
        [magasinId]="magasinId"
        [agentId]="agentId"
        [isAdmin]="isAdmin"
        [modesPaiement]="modesPaiement"
      ></app-depenses>
    </div>

    <div class="tab-pane fade" id="nav-recette" role="tabpanel" 
         aria-labelledby="nav-recette-tab">
      <app-recettes
        [code_structure]="code_structure"
        [magasinId]="magasinId"
        [agentId]="agentId"
        [isAdmin]="isAdmin"
        [modesPaiement]="modesPaiement"
      ></app-recettes>
    </div>

    <div class="tab-pane fade" id="nav-categorie" role="tabpanel" 
         aria-labelledby="nav-categorie-tab">
      <app-categorie-depense-recette
        [code_structure]="code_structure"
      ></app-categorie-depense-recette>
    </div>
  </div>
</div>
