<div class="container-fluid mt-1">
  <!-- Navigation des onglets -->
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <button
        type="button"
        class="nav-link"
        [class.active]="activeTab === 'depenses'"
        (click)="setActiveTab('depenses')"
      >
        Dépenses
      </button>
    </li>
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="activeTab === 'recettes'"
        (click)="setActiveTab('recettes')"
      >
        Recettes
      </button>
    </li>
    <li class="nav-item">
      <button
        type="button"
        class="nav-link"
        [class.active]="activeTab === 'categories'"
        (click)="setActiveTab('categories')"
      >
        Gestion des catégories
      </button>
    </li>
  </ul>

  <!-- Message d'erreur global -->
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <!-- Indicateur de chargement global -->
  <div *ngIf="isLoading" class="text-center mt-1">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p class="mt-2">Chargement des données...</p>
  </div>

  <div class="tab-content mt-1">
    <!-- Onglet Dépenses -->
    <div *ngIf="activeTab === 'depenses'" class="tab-pane active">
      <app-depenses
        [categories]="categoriesDepense"
        [code_structure]="code_structure"
        [magasinId]="magasinId"
        [agentId]="agentId"
        [isAdmin]="isAdmin"
        [modesPaiement]="modesPaiement"
        (categoryAction)="onCategoryAction($event)"
        (depenseAction)="onDepenseAction($event)"
        (refreshCategories)="refreshCategories()"
      ></app-depenses>
    </div>

    <!-- Onglet Recettes -->
    <div *ngIf="activeTab === 'recettes'" class="tab-pane active">
      <app-recettes
        [categories]="categoriesRecette"
        [code_structure]="code_structure"
        [magasinId]="magasinId"
        [agentId]="agentId"
        [isAdmin]="isAdmin"
        [modesPaiement]="modesPaiement"
        (categoryAction)="onCategoryAction($event)"
        (recetteAction)="onRecetteAction($event)"
        (refreshCategories)="refreshCategories()"
      ></app-recettes>
    </div>

    <!-- Onglet Gestion des catégories -->
    <div *ngIf="activeTab === 'categories'" class="tab-pane active">
      <app-categorie-depense-recette
        [categories]="categories"
        [code_structure]="code_structure"
        (categoryAction)="onCategoryAction($event)"
        (categoriesChange)="refreshCategories()"
      ></app-categorie-depense-recette>
    </div>
  </div>
</div>
