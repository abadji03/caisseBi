<div class="container-fluid">
  <div class="row">
    <!-- Sidebar (2 colonnes) -->
    <div class="col-2 sidebar" [class.collapsed]="isSidebarCollapsed">
      <nav>
        <div class="sidebar-header">
          <img src="./assets/CMP.png" class="avatar img-fluid rounded me-1" alt="User" width="50" height="50" />
          <span class="text-dark" *ngIf="!isSidebarCollapsed">User</span>
          <h4 *ngIf="!isSidebarCollapsed">Nom Structure</h4>
        </div>

        <div class="accordion" id="accordionSidebar">

          <!-- Accueil -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#homeMenu" aria-expanded="false">
                <i class="bi bi-house-door"></i>
                <span *ngIf="!isSidebarCollapsed">Accueil</span>
              </button>
            </h2>
            <div id="homeMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/overview" routerLinkActive="active">Vue d'ensemble</button>
              </div>
            </div>
          </div>

          <!-- Ventes -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#ventesMenu" aria-expanded="false">
                <i class="bi bi-cash-stack"></i>
                <span *ngIf="!isSidebarCollapsed">Ventes</span>
              </button>
            </h2>
            <div id="ventesMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/ventes" routerLinkActive="active">Ventes</button>
                <button class="nav-link" routerLink="/espace-vendeurs/caisse" routerLinkActive="active">Caisse</button>
                <button class="nav-link" routerLink="/espace-vendeurs/clients" routerLinkActive="active">Clients</button>
              </div>
            </div>
          </div>

          <!-- Stock et Inventaire -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#stockMenu" aria-expanded="false">
                <i class="bi bi-box"></i>
                <span *ngIf="!isSidebarCollapsed">Stock & Inventaire</span>
              </button>
            </h2>
            <div id="stockMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/entrees-sorties" routerLinkActive="active">Entrées/Sorties</button>
                <button class="nav-link" routerLink="/espace-vendeurs/stock" routerLinkActive="active">Stock</button>
                <button class="nav-link" routerLink="/espace-vendeurs/catalogue-produits" routerLinkActive="active">Catalogue</button>
                <button class="nav-link" routerLink="/espace-vendeurs/enregistrement-produit" routerLinkActive="active">Ajout Produit</button>
              </div>
            </div>
          </div>

          <!-- Finance -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#financeMenu" aria-expanded="false">
                <i class="bi bi-wallet"></i>
                <span *ngIf="!isSidebarCollapsed">Finance</span>
              </button>
            </h2>
            <div id="financeMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/finance" routerLinkActive="active">Gestion Financière</button>
                <button class="nav-link" routerLink="/espace-vendeurs/fournisseurs" routerLinkActive="active">Fournisseurs</button>
              </div>
            </div>
          </div>

          <!-- Rapports -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#rapportsMenu" aria-expanded="false">
                <i class="bi bi-graph-up"></i>
                <span *ngIf="!isSidebarCollapsed">Rapports</span>
              </button>
            </h2>
            <div id="rapportsMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/rapport-financier" routerLinkActive="active">Rapport financier</button>
                <button class="nav-link" routerLink="/espace-vendeurs/rapport-vente" routerLinkActive="active">Rapport vente</button>
                <button class="nav-link" routerLink="/espace-vendeurs/rapport-stk" routerLinkActive="active">Rapport stock</button>

              </div>
            </div>
          </div>

          <!-- Compte & Paramètres -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button no-arrow" data-bs-toggle="collapse" data-bs-target="#compteMenu" aria-expanded="false">
                <i class="bi bi-gear"></i>
                <span *ngIf="!isSidebarCollapsed">Compte & Paramètres</span>
              </button>
            </h2>
            <div id="compteMenu" class="accordion-collapse collapse" data-bs-parent="#accordionSidebar">
              <div class="accordion-body">
                <button class="nav-link" routerLink="/espace-vendeurs/magasins" routerLinkActive="active">Magasins</button>
                <button class="nav-link" routerLink="/espace-vendeurs/gerant" routerLinkActive="active">Personnel</button>
                <button class="nav-link" routerLink="/espace-vendeurs/parametres" routerLinkActive="active">Paramètres</button>
                <!-- <button class="nav-link" routerLink="/espace-vendeurs/user-account" routerLinkActive="active">Profil</button> -->
              </div>
            </div>
          </div>

        </div>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="col-10 main-content" [ngClass]="{'col-10': !isSidebarCollapsed, 'col-11': isSidebarCollapsed}">
      <header class="header d-flex justify-content-between align-items-center">
        <button class="menu-toggle" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
       <div class="header-title">
          <small class="text-muted">{{ currentMenu }}/</small> 
          <span class="h4 ms-5 text-uppercase">{{ currentSubMenu }}</span>
       </div>

        <div class="btn-group">
          <div class="mt-0 py-3">
            <i class="bi bi-bell position-relative icon-notification">
              <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">3</span>
            </i>
          </div>
          <button class="btn dropdown-toggle" id="idMenu" data-bs-toggle="dropdown">
            <img src="./assets/CMP.png" class="avatar img-fluid rounded me-1" width="30" height="30" />
            <span class="text-dark">User</span>
          </button>
          <ul class="dropdown-menu">
            <li><button class="dropdown-item" routerLink="/user-login"><i class="bi bi-person"></i> Profil</button></li>
            <li><button class="dropdown-item" routerLink="/user-account"><i class="bi bi-gear"></i> Paramètres</button></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item">Déconnexion</button></li>
          </ul>
        </div>
      </header>

      <div class="dashboard-overview">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
